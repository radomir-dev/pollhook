name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: googleapis/release-please-action@v4
        id: plan
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the release PR
        if: steps.plan.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.plan.outputs.pr || '{}').number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
      - uses: googleapis/release-please-action@v4
        id: release
        if: steps.plan.outputs.prs_created == 'true' || steps.plan.outputs.release_created == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm when main carries an unpublished version
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "pollhook@$version" version >/dev/null 2>&1; then
            echo "pollhook@$version is already on npm"
            exit 0
          fi
          npm ci
          npm publish --provenance --access public
