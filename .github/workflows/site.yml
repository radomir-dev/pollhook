name: site

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-site.ts", "docs/demo.gif"]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the site
        run: node scripts/build-site.ts
      - name: Publish dist-site as an independent gh-pages branch
        working-directory: dist-site
        env:
          TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('../package.json').version")
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy v$version"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
