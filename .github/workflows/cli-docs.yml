name: cli-docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate the CLI section
        run: node scripts/cli-docs.ts
      - name: Fail when the README is stale on a pull request
        if: github.event_name == 'pull_request'
        run: node scripts/cli-docs.ts --check
      - name: Commit the regenerated section on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet README.md pollhook.schema.json; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pollhook.schema.json
          git commit -m "docs: regenerate the cli reference [skip ci]"
          git push
